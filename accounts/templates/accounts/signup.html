<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>
    <h1>Create an account</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign up</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    <p><a href="{% url 'home' %}">&larr; Back to home</a></p>
</body>
</html>
