{% extends 'blog/base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 420px;">
    <div class="card-body">
        <h1 class="h3 mb-3">Create an account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>
        <p class="mt-3 mb-0 small">Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
