<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Blog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        form input[type=text], form input[type=password], form textarea {
            width: 100%;
            padding: .5rem;
            border: 1px solid #ced4da;
            border-radius: .375rem;
        }
        form p { margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">My Blog</a>
        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <a class="btn btn-success btn-sm" href="{% url 'post_create' %}">+ New Post</a>
                <span class="text-white small">Hello, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
                <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container my-4" style="max-width: 800px;">
    {% block content %}{% endblock %}
</main>

</body>
</html>
