<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>
    <h1>My Blog</h1>

    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>By {{ post.author.username }} on {{ post.created_at|date:"d M Y" }}</p>
            <p>{{ post.content|truncatewords:30 }}</p>
            <hr>
        </div>
    {% empty %}
        <p>No posts yet.</p>
    {% endfor %}
</body>
</html>
